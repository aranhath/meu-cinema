<!DOCTYPE html>
<html lang="pt-br" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>RJ FLIX • Filmes, Séries, Animes & TV ao Vivo</title>
  
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="apple-touch-icon" href="./favicon.svg">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#08090c">

  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#e50914', 600: '#b81d24' }
          }
        }
      }
    }
  </script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <!-- Firebase SDK (v9 Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    html, body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 0%, #1a0b2e 0%, #08090c 60%, #030406 100%);
      background-attachment: fixed;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
      overscroll-behavior-y: none;
      -webkit-user-select: none;
      user-select: none;
    }

    input, select, textarea {
      font-size: 16px !important;
      -webkit-text-size-adjust: 100%;
      user-select: text;
    }

    .liquid-glass {
      background: rgba(22, 24, 34, 0.95);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), inset 0 1px 1px rgba(255, 255, 255, 0.2);
    }

    .liquid-glass-card {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.01) 100%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1.25rem;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .liquid-glass-card:hover {
      transform: translateY(-6px) scale(1.02);
      border-color: rgba(229, 9, 20, 0.5);
      box-shadow: 0 20px 40px -10px rgba(229, 9, 20, 0.3), inset 0 1px 2px rgba(255, 255, 255, 0.4);
    }

    .liquid-glass-card:hover .play-overlay {
      opacity: 1;
    }

    .badge-capa {
      background: rgba(10, 10, 15, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    .nav-active {
      background: linear-gradient(135deg, rgba(229, 9, 20, 0.3) 0%, rgba(229, 9, 20, 0.1) 100%) !important;
      color: #ffffff !important;
      border: 1px solid rgba(229, 9, 20, 0.6) !important;
      box-shadow: 0 8px 20px rgba(229, 9, 20, 0.25), inset 0 1px 1px rgba(255, 255, 255, 0.3) !important;
      font-weight: 800 !important;
    }

    .genre-btn-active {
      background: rgba(229, 9, 20, 0.85) !important;
      color: #ffffff !important;
      border-color: rgba(255, 255, 255, 0.3) !important;
      box-shadow: 0 8px 20px rgba(229, 9, 20, 0.3) !important;
    }

    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .modal-closed { opacity: 0 !important; pointer-events: none !important; transform: scale(0.95); }
    .modal-open { opacity: 1 !important; pointer-events: auto !important; transform: scale(1); }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-brand-500 selection:text-white relative">

  <!-- GLOW DE FUNDO -->
  <div class="fixed top-0 left-1/4 w-96 h-96 bg-brand-500/10 rounded-full blur-[120px] pointer-events-none z-0"></div>
  <div class="fixed bottom-0 right-1/4 w-96 h-96 bg-purple-600/10 rounded-full blur-[120px] pointer-events-none z-0"></div>

  <div id="searchBackdrop" onclick="clearGlobalSearch()" class="fixed inset-0 bg-transparent z-30 pointer-events-none"></div>

  <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <div id="authScreenContainer"></div>

  <div id="appScreen" class="hidden flex-col min-h-screen relative z-10">
    
    <!-- NAVBAR -->
    <header class="sticky top-0 z-40 bg-black/50 border-b border-white/10 backdrop-blur-xl px-4 py-3.5 sm:px-8 flex items-center justify-between shadow-2xl">
      <div class="flex items-center gap-4">
        <div class="flex items-center gap-2.5 cursor-pointer" onclick="switchTab('home')">
          <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-brand-500 via-rose-600 to-purple-700 flex items-center justify-center text-white font-black text-sm shadow-lg shadow-brand-500/40 border border-white/30">
            <i class="fa-solid fa-play"></i>
          </div>
          <span class="font-black text-xl tracking-wider text-white">RJ<span class="text-brand-500"> FLIX</span></span>
        </div>

        <nav class="hidden md:flex items-center gap-1.5 ml-4">
          <button onclick="switchTab('home')" id="tab-home" class="nav-tab px-3.5 py-2 rounded-2xl text-xs font-semibold text-zinc-300 hover:text-white transition cursor-pointer">Início</button>
          <button onclick="switchTab('movies')" id="tab-movies" class="nav-tab px-3.5 py-2 rounded-2xl text-xs font-semibold text-zinc-300 hover:text-white transition cursor-pointer">Filmes</button>
          <button onclick="switchTab('series')" id="tab-series" class="nav-tab px-3.5 py-2 rounded-2xl text-xs font-semibold text-zinc-300 hover:text-white transition cursor-pointer">Séries</button>
          <button onclick="switchTab('animes')" id="tab-animes" class="nav-tab px-3.5 py-2 rounded-2xl text-xs font-semibold text-zinc-300 hover:text-white transition cursor-pointer">Animes</button>
          <button onclick="switchTab('tv')" id="tab-tv" class="nav-tab px-3.5 py-2 rounded-2xl text-xs font-semibold text-zinc-300 hover:text-white transition cursor-pointer flex items-center gap-1.5">
            <i class="fa-solid fa-tv text-rose-500"></i>
            <span>TV ao Vivo</span>
          </button>
          
          <button onclick="switchTab('mycatalog')" id="tab-mycatalog" class="nav-tab px-4 py-2 rounded-2xl text-xs font-extrabold text-emerald-300 bg-emerald-950/40 hover:bg-emerald-900/60 border border-emerald-500/40 shadow-lg shadow-emerald-500/20 transition flex items-center gap-1.5 cursor-pointer ml-2">
            <i class="fa-solid fa-bookmark text-emerald-400"></i>
            <span>MEU CATÁLOGO</span>
          </button>
        </nav>
      </div>

      <div class="flex items-center gap-2">
        <h1 id="userWelcomeHeader" class="hidden sm:block text-xs font-bold text-zinc-300 mr-2">RJ FLIX</h1>

        <button onclick="logout()" title="Sair" class="bg-white/10 hover:bg-rose-500/20 hover:text-rose-400 text-zinc-300 p-2 text-xs rounded-2xl border border-white/10 transition cursor-pointer ml-1">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </header>

    <!-- MENU MOBILE -->
    <div class="md:hidden flex items-center justify-between bg-black/50 border-b border-white/10 px-3 py-2.5 overflow-x-auto hide-scrollbar backdrop-blur-xl">
      <button onclick="switchTab('home')" class="px-3 py-1.5 text-xs font-bold text-white whitespace-nowrap rounded-xl bg-white/10">Início</button>
      <button onclick="switchTab('movies')" class="px-3 py-1.5 text-xs font-semibold text-zinc-300 whitespace-nowrap">Filmes</button>
      <button onclick="switchTab('series')" class="px-3 py-1.5 text-xs font-semibold text-zinc-300 whitespace-nowrap">Séries</button>
      <button onclick="switchTab('animes')" class="px-3 py-1.5 text-xs font-semibold text-zinc-300 whitespace-nowrap">Animes</button>
      <button onclick="switchTab('tv')" class="px-3 py-1.5 text-xs font-bold text-rose-400 bg-rose-950/40 border border-rose-500/30 rounded-xl whitespace-nowrap flex items-center gap-1">
        <i class="fa-solid fa-tv text-[10px]"></i> TV ao Vivo
      </button>
      <button onclick="switchTab('mycatalog')" class="px-3 py-1.5 text-xs font-bold text-emerald-300 bg-emerald-950/60 border border-emerald-500/40 rounded-xl whitespace-nowrap flex items-center gap-1">
        <i class="fa-solid fa-bookmark text-[10px]"></i> Catálogo
      </button>
    </div>

    <!-- MAIN BODY -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6 sm:px-8 space-y-8">

      <!-- BARRA DE BUSCA GLOBAL -->
      <div class="relative z-30">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-zinc-300 text-sm"></i>
          <input type="search" id="globalSearchInput" onkeyup="handleGlobalSearch(event)" placeholder="Buscar filmes, séries, animes e canais ao vivo..." autocomplete="off" class="w-full bg-[#181a26] border-2 border-brand-500/60 rounded-2xl pl-11 pr-12 py-3.5 text-base text-white focus:outline-none focus:border-brand-500 transition font-bold shadow-2xl">
          <button id="clearSearchBtn" onclick="clearGlobalSearch()" class="hidden absolute right-3 top-1/2 -translate-y-1/2 w-8 h-8 rounded-xl bg-white/20 hover:bg-white/30 text-white flex items-center justify-center text-xs transition cursor-pointer">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <div id="searchResultsPanel" class="opacity-0 translate-y-2 pointer-events-none transition-all duration-200 absolute left-0 right-0 top-full mt-3 bg-[#181a26] border-2 border-zinc-700/80 rounded-3xl shadow-2xl max-h-[75vh] overflow-y-auto p-3.5 sm:p-5 space-y-4 z-50">
          <div class="flex items-center justify-between border-b border-zinc-700/80 pb-3">
            <span class="text-xs font-black uppercase tracking-wider text-white flex items-center gap-2">
              <i class="fa-solid fa-magnifying-glass text-brand-500"></i> Resultados da Busca
            </span>
            <button onclick="clearGlobalSearch()" class="px-3 py-1.5 rounded-xl text-xs font-bold text-white bg-rose-600 hover:bg-rose-500 transition flex items-center gap-1 cursor-pointer shadow-md">
              <i class="fa-solid fa-xmark"></i> Fechar
            </button>
          </div>

          <div id="sectionTVResults" class="hidden space-y-2">
            <h3 class="text-xs font-black uppercase tracking-wider text-rose-400 flex items-center gap-1.5 border-b border-zinc-700/60 pb-1">
              <i class="fa-solid fa-tv"></i> Canais de TV ao Vivo
            </h3>
            <div id="resultsTVList" class="grid grid-cols-1 md:grid-cols-2 gap-2.5"></div>
          </div>

          <div id="sectionSaved" class="hidden space-y-2">
            <h3 class="text-xs font-black uppercase tracking-wider text-emerald-400 flex items-center gap-1.5 border-b border-zinc-700/60 pb-1">
              <i class="fa-solid fa-bookmark"></i> No Seu Catálogo
            </h3>
            <div id="resultsSavedList" class="grid grid-cols-1 md:grid-cols-2 gap-2.5"></div>
          </div>

          <div id="sectionTMDB" class="hidden space-y-2">
            <h3 class="text-xs font-black uppercase tracking-wider text-brand-500 flex items-center gap-1.5 border-b border-zinc-700/60 pb-1">
              <i class="fa-solid fa-film"></i> Filmes, Séries & Animes
            </h3>
            <div id="resultsTMDBList" class="grid grid-cols-1 md:grid-cols-2 gap-2.5"></div>
          </div>
        </div>
      </div>

      <!-- HERO BANNER -->
      <section id="heroSection" class="relative rounded-3xl overflow-hidden liquid-glass min-h-[280px] sm:min-h-[360px] flex items-end p-6 sm:p-10 border border-white/15 shadow-2xl">
        <div id="heroBg" class="absolute inset-0 bg-cover bg-center transition-all duration-700 opacity-45"></div>
        <div class="absolute inset-0 bg-gradient-to-t from-[#08090c] via-[#08090c]/60 to-transparent"></div>
        
        <div class="relative z-10 max-w-2xl space-y-3">
          <span id="heroBadge" class="px-3.5 py-1 rounded-xl bg-brand-500/20 text-brand-400 border border-brand-500/40 text-[11px] font-extrabold uppercase tracking-wider backdrop-blur-md">
            Destaque em Alta
          </span>
          <h2 id="heroTitle" class="text-2xl sm:text-4xl font-black text-white leading-tight">Carregando...</h2>
          <p id="heroOverview" class="text-xs sm:text-sm text-zinc-300 line-clamp-2 font-medium"></p>
          <div class="flex items-center gap-3 pt-2">
            <button id="heroPlayBtn" onclick="" class="px-6 py-3 bg-brand-500 hover:bg-brand-600 text-white font-bold text-xs rounded-2xl shadow-xl shadow-brand-500/30 transition flex items-center gap-2 cursor-pointer">
              <i class="fa-solid fa-play"></i> Assistir Agora
            </button>
          </div>
        </div>
      </section>

      <!-- SEÇÃO HOME -->
      <section id="sectionTrending" class="space-y-3">
        <div class="flex items-center justify-between border-b border-white/10 pb-2">
          <h2 class="text-base font-black text-white uppercase tracking-wider flex items-center gap-2">
            <i class="fa-solid fa-fire text-brand-500"></i> Em Alta na Semana
          </h2>
        </div>
        <div id="gridTrending" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4"></div>
      </section>

      <!-- TV AO VIVO -->
      <section id="sectionTV" class="hidden space-y-6">
        <div class="liquid-glass p-6 rounded-3xl space-y-4">
          <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 border-b border-white/10 pb-3">
            <div>
              <h2 class="text-xl font-black text-white uppercase tracking-wider flex items-center gap-2">
                <i class="fa-solid fa-satellite-dish text-rose-500 animate-pulse"></i> Canais de TV ao Vivo (Rei dos Embeds)
              </h2>
              <p class="text-xs text-zinc-400">Todos os canais da API sincronizados com rotas de redundância</p>
            </div>
            <button onclick="fetchReiDosEmbedsChannels()" class="px-3.5 py-2 bg-rose-600/80 hover:bg-rose-600 text-white font-bold text-xs rounded-xl transition flex items-center gap-1.5 cursor-pointer">
              <i class="fa-solid fa-arrows-rotate text-xs"></i> Atualizar Lista
            </button>
          </div>

          <div class="flex items-center gap-2 overflow-x-auto hide-scrollbar pb-1" id="tvFilterButtons">
            <button onclick="filterTVCategory('all', this)" class="genre-btn genre-btn-active px-4 py-2 rounded-2xl border border-white/10 text-xs font-bold transition whitespace-nowrap">Todos os Canais</button>
            <button onclick="filterTVCategory('esportes', this)" class="genre-btn bg-white/5 hover:bg-white/10 px-4 py-2 rounded-2xl border border-white/10 text-xs font-semibold text-zinc-300 transition whitespace-nowrap">Esportes</button>
            <button onclick="filterTVCategory('abertos', this)" class="genre-btn bg-white/5 hover:bg-white/10 px-4 py-2 rounded-2xl border border-white/10 text-xs font-semibold text-zinc-300 transition whitespace-nowrap">Gerais / Abertos</button>
            <button onclick="filterTVCategory('filmes', this)" class="genre-btn bg-white/5 hover:bg-white/10 px-4 py-2 rounded-2xl border border-white/10 text-xs font-semibold text-zinc-300 transition whitespace-nowrap">Filmes & Séries</button>
          </div>
        </div>

        <div class="space-y-3">
          <div id="gridTVChannels" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4"></div>
        </div>
      </section>

      <!-- OUTRAS ABAS -->
      <section id="sectionMovies" class="hidden space-y-6"><div id="gridMovies" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4"></div></section>
      <section id="sectionSeries" class="hidden space-y-6"><div id="gridSeries" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4"></div></section>
      <section id="sectionAnimes" class="hidden space-y-6"><div id="gridAnimes" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4"></div></section>
      <section id="sectionMyCatalog" class="hidden space-y-4"><div id="gridMyCatalog" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4"></div></section>

    </main>
  </div>

  <!-- PLAYER OVERLAY COM SELETOR DE ROTA/SERVIDOR -->
  <div id="playerOverlay" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-2xl opacity-0 pointer-events-none transition-opacity duration-300 flex flex-col">
    <div id="playerHeader" class="absolute top-4 right-4 z-50 flex items-center gap-2 bg-black/70 border border-white/15 p-2 rounded-2xl shadow-2xl backdrop-blur-xl">
      <div class="hidden sm:block px-3 text-left">
        <h2 id="playerTitle" class="text-xs font-bold text-white truncate max-w-[180px]">...</h2>
        <p id="playerSubtitle" class="text-[10px] text-zinc-400 font-medium"></p>
      </div>

      <!-- SELETOR DE ROTA PARA CANAIS DA TV -->
      <select id="serverRouteSelect" onchange="changeServerRoute()" class="hidden bg-rose-950/80 border border-rose-500/50 text-white text-xs font-bold py-1.5 px-2.5 rounded-xl focus:outline-none cursor-pointer">
        <option value="0">Opção 1 (Principal)</option>
        <option value="1">Opção 2 (Servidor B)</option>
        <option value="2">Opção 3 (Servidor C)</option>
      </select>

      <button onclick="closePlayer()" title="Fechar Player" class="px-4 py-2 bg-brand-500 hover:bg-brand-600 text-white font-semibold text-xs rounded-xl shadow-lg shadow-brand-500/30 transition flex items-center gap-1.5 cursor-pointer">
        <i class="fa-solid fa-xmark"></i>
        <span>Sair</span>
      </button>
    </div>

    <div id="iframeHolder" class="w-full h-full relative"></div>
  </div>

  <script>

      { id: "telecine-action", name: "Telecine Action", category: "filmes", icon: "fa-film", color: "from-red-700 to-amber-900", routes: ["https://embed.reidosembeds.online/canal/telecine-action", "https://v2.rdembed.sbs/canal/telecine-action", "https://reidosembeds.online/embed/telecine-action"] },
      { id: "hbo", name: "HBO", category: "filmes", icon: "fa-clapperboard", color: "from-purple-700 to-violet-950", routes: ["https://embed.reidosembeds.online/canal/hbo", "https://v2.rdembed.sbs/canal/hbo", "https://reidosembeds.online/embed/hbo"] },
      { id: "tnt", name: "TNT", category: "filmes", icon: "fa-film", color: "from-pink-600 to-rose-900", routes: ["https://embed.reidosembeds.online/canal/tnt", "https://v2.rdembed.sbs/canal/tnt", "https://reidosembeds.online/embed/tnt"] }
    ];

    const firebaseConfig = {
      apiKey: "AIzaSyC2NZ67Uh1biKo27WvRoT5B41GLMOUM0xo",
      authDomain: "meu-cinema-931ad.firebaseapp.com",
      databaseURL: "https://meu-cinema-931ad-default-rtdb.firebaseio.com",
      projectId: "meu-cinema-931ad",
      storageBucket: "meu-cinema-931ad.firebasestorage.app",
      messagingSenderId: "217991334157",
      appId: "1:217991334157:web:cba2f7f21f0a835d750844"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    let currentChannelRoutes = [];
    let activeChannelTitle = "";
    let tvCategory = 'all';
    const TMDB_API_KEY = "15d2ea6d0dc1d476efbca3eba2b9bbfb";

    auth.onAuthStateChanged((user) => {
      if (!user) auth.signInAnonymously();
      switchTab('home');
    });

    function switchTab(tabName) {
      const allSections = ['heroSection', 'sectionTrending', 'sectionTV', 'sectionMovies', 'sectionSeries', 'sectionAnimes', 'sectionMyCatalog'];
      allSections.forEach(s => document.getElementById(s)?.classList.add('hidden'));

      if (tabName === 'home') {
        ['heroSection', 'sectionTrending'].forEach(s => document.getElementById(s)?.classList.remove('hidden'));
        loadFullHomeData();
      } else if (tabName === 'tv') {
        document.getElementById('sectionTV')?.classList.remove('hidden');
        fetchReiDosEmbedsChannels();
      }
    }

    async function fetchReiDosEmbedsChannels() {
      try {
        const res = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent('https://reidosembeds.online/api/channels')}`);
        const data = await res.json();
        
        if (Array.isArray(data) && data.length > 0) {
          apiChannelsList = data.map(ch => {
            const slug = ch.id || ch.slug || ch.name.toLowerCase().replace(/\s+/g, '-');
            return {
              id: slug,
              name: ch.name || ch.title,
              category: ch.category || 'abertos',
              icon: 'fa-tv',
              color: 'from-zinc-800 to-zinc-950',
              routes: [
                ch.embed_url || `https://embed.reidosembeds.online/canal/${slug}`,
                `https://v2.rdembed.sbs/canal/${slug}`,
                `https://reidosembeds.online/embed/${slug}`
              ]
            };
          });
        }
      } catch (err) {
        console.log("Usando banco local otimizado de canais...");
      }
      renderTVGrid();
    }

    function renderTVGrid() {
      const grid = document.getElementById('gridTVChannels');
      grid.innerHTML = '';

      let list = apiChannelsList;
      if (tvCategory !== 'all') {
        list = list.filter(c => c.category === tvCategory);
      }

      list.forEach(ch => {
        const div = document.createElement('div');
        div.className = "liquid-glass-card group relative overflow-hidden flex flex-col cursor-pointer border-rose-500/20 hover:border-rose-500/80 transition shadow-lg";
        
        div.innerHTML = `
          <div class="aspect-video w-full bg-gradient-to-br ${ch.color || 'from-zinc-800 to-zinc-950'} relative overflow-hidden rounded-t-2xl flex items-center justify-center p-3" onclick="playChannel('${ch.id}')">
            <div class="absolute top-2 left-2 z-20">
              <span class="badge-capa text-[9px] font-extrabold px-2 py-0.5 rounded-lg text-rose-400 flex items-center gap-1">
                <span class="w-1.5 h-1.5 rounded-full bg-rose-500 animate-pulse"></span> AO VIVO
              </span>
            </div>

            <div class="text-center flex flex-col items-center gap-1 text-white">
              <i class="fa-solid ${ch.icon || 'fa-tv'} text-3xl text-rose-400 drop-shadow-md"></i>
              <span class="text-xs font-black tracking-wider uppercase mt-1">${ch.name}</span>
            </div>
          </div>

          <div class="p-3 bg-black/40 rounded-b-2xl border-t border-white/10">
            <h4 class="font-bold text-xs text-white truncate">${ch.name}</h4>
          </div>
        `;
        grid.appendChild(div);
      });
    }

    function playChannel(id) {
      const ch = apiChannelsList.find(c => c.id === id);
      if (!ch) return;

      currentChannelRoutes = ch.routes;
      activeChannelTitle = ch.name;

      const routeSelect = document.getElementById('serverRouteSelect');
      routeSelect.classList.remove('hidden');
      routeSelect.selectedIndex = 0;

      loadIframeUrl(currentChannelRoutes[0], ch.name, 'TV ao Vivo');
    }

    function changeServerRoute() {
      const idx = document.getElementById('serverRouteSelect').value;
      if (currentChannelRoutes[idx]) {
        loadIframeUrl(currentChannelRoutes[idx], activeChannelTitle, 'TV ao Vivo');
      }
    }

    function playCustomUrl(url, title, subtitle) {
      document.getElementById('serverRouteSelect').classList.add('hidden');
      loadIframeUrl(url, title, subtitle);
    }

    function loadIframeUrl(embedUrl, title, subtitle) {
      document.getElementById('playerTitle').innerText = title;
      document.getElementById('playerSubtitle').innerText = subtitle || 'Player Principal';

      const holder = document.getElementById('iframeHolder');
      holder.innerHTML = '';

      const iframe = document.createElement('iframe');
      iframe.src = embedUrl;
      iframe.className = "w-full h-full border-0 relative z-10";
      iframe.allow = "autoplay; encrypted-media; fullscreen; picture-in-picture";
      iframe.setAttribute('allowfullscreen', 'true');

      holder.appendChild(iframe);

      const overlay = document.getElementById('playerOverlay');
      overlay.classList.replace('opacity-0', 'opacity-100');
      overlay.classList.replace('pointer-events-none', 'pointer-events-auto');
    }

    function closePlayer() {
      document.getElementById('iframeHolder').innerHTML = '';
      const overlay = document.getElementById('playerOverlay');
      overlay.classList.replace('opacity-100', 'opacity-0');
      overlay.classList.replace('pointer-events-auto', 'pointer-events-none');
    }

    function filterTVCategory(cat, btn) {
      tvCategory = cat;
      document.querySelectorAll('#tvFilterButtons .genre-btn').forEach(b => b.classList.remove('genre-btn-active'));
      btn.classList.add('genre-btn-active');
      renderTVGrid();
    }

    async function loadFullHomeData() {
      try {
        const resTrend = await fetch(`https://api.themoviedb.org/3/trending/all/week?api_key=${TMDB_API_KEY}&language=pt-BR`);
        const dataTrend = await resTrend.json();
        if (dataTrend.results && dataTrend.results.length > 0) {
          const item = dataTrend.results[0];
          document.getElementById('heroBg').style.backgroundImage = `url('https://image.tmdb.org/t/p/original${item.backdrop_path}')`;
          document.getElementById('heroTitle').innerText = item.title || item.name;
          document.getElementById('heroOverview').innerText = item.overview || '';
          document.getElementById('heroPlayBtn').onclick = () => playCustomUrl(`https://superflixapi.quest/filme/${item.id}`, item.title || item.name, 'Filme');

          const grid = document.getElementById('gridTrending');
          grid.innerHTML = '';
          dataTrend.results.slice(1, 13).forEach(it => {
            const title = it.title || it.name;
            const poster = `https://image.tmdb.org/t/p/w500${it.poster_path}`;
            const div = document.createElement('div');
            div.className = "liquid-glass-card group relative overflow-hidden flex flex-col cursor-pointer";
            div.innerHTML = `
              <div class="aspect-[2/3] w-full bg-black/40 relative overflow-hidden rounded-t-2xl" onclick="playCustomUrl('https://superflixapi.quest/filme/${it.id}', '${encodeURIComponent(title)}', 'Filme')">
                <img src="${poster}" alt="${title}" loading="lazy" class="w-full h-full object-cover">
              </div>
              <div class="p-3 bg-black/30 rounded-b-2xl border-t border-white/10">
                <h4 class="font-bold text-xs text-white truncate">${title}</h4>
              </div>
            `;
            grid.appendChild(div);
          });
        }
      } catch (err) {}
    }

    function logout() { auth.signOut(); }
  </script>
</body>
</html>
