    .liquid-glass {
      background: rgba(22, 24, 34, 0.95);
      backdrop-filter: blur(20px) saturate(180%);

  <script>
    // CONFIG FIREBASE
    const firebaseConfig = {
      apiKey: "AIzaSyC2NZ67Uh1biKo27WvRoT5B41GLMOUM0xo",
      authDomain: "meu-cinema-931ad.firebaseapp.com",
      databaseURL: "https://meu-cinema-931ad-default-rtdb.firebaseio.com",
      projectId: "meu-cinema-931ad",
      storageBucket: "meu-cinema-931ad.firebasestorage.app",
      messagingSenderId: "217991334157",
      appId: "1:217991334157:web:cba2f7f21f0a835d750844"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const TMDB_API_KEY = "15d2ea6d0dc1d476efbca3eba2b9bbfb";

    let activeMediaRoutes = [];
    let activeMediaTitle = "";
    let activeMediaSubtitle = "";

    // BASE DE DADOS COMPLETA DE CANAIS DE TV
    const CHANNELS = [
      { id: "globo-rj", name: "Globo RJ", category: "abertos", icon: "fa-tv", color: "from-blue-600 to-indigo-800", routes: ["https://reidosembeds.online/embed/globo-rj", "https://v2.rdembed.sbs/canal/globo-rj", "https://embed.reidosembeds.online/canal/globo-rj"] },
      { id: "globo-sp", name: "Globo SP", category: "abertos", icon: "fa-tv", color: "from-blue-700 to-indigo-900", routes: ["https://reidosembeds.online/embed/globo-sp", "https://v2.rdembed.sbs/canal/globo-sp", "https://embed.reidosembeds.online/canal/globo-sp"] },
      { id: "sportv", name: "SporTV 1", category: "esportes", icon: "fa-futbol", color: "from-green-600 to-emerald-800", routes: ["https://reidosembeds.online/embed/sportv", "https://v2.rdembed.sbs/canal/sportv", "https://embed.reidosembeds.online/canal/sportv"] },
      { id: "sportv-2", name: "SporTV 2", category: "esportes", icon: "fa-futbol", color: "from-green-700 to-teal-900", routes: ["https://reidosembeds.online/embed/sportv-2", "https://v2.rdembed.sbs/canal/sportv-2", "https://embed.reidosembeds.online/canal/sportv-2"] },
      { id: "sportv-3", name: "SporTV 3", category: "esportes", icon: "fa-futbol", color: "from-emerald-600 to-green-900", routes: ["https://reidosembeds.online/embed/sportv-3", "https://v2.rdembed.sbs/canal/sportv-3", "https://embed.reidosembeds.online/canal/sportv-3"] },
      { id: "espn", name: "ESPN 1", category: "esportes", icon: "fa-trophy", color: "from-red-600 to-rose-900", routes: ["https://reidosembeds.online/embed/espn", "https://v2.rdembed.sbs/canal/espn", "https://embed.reidosembeds.online/canal/espn"] },
      { id: "espn-2", name: "ESPN 2", category: "esportes", icon: "fa-trophy", color: "from-red-700 to-rose-950", routes: ["https://reidosembeds.online/embed/espn-2", "https://v2.rdembed.sbs/canal/espn-2", "https://embed.reidosembeds.online/canal/espn-2"] },
      { id: "premiere-clubes", name: "Premiere Clubes", category: "esportes", icon: "fa-shirt", color: "from-green-500 to-emerald-700", routes: ["https://reidosembeds.online/embed/premiere-clubes", "https://v2.rdembed.sbs/canal/premiere-clubes", "https://embed.reidosembeds.online/canal/premiere-clubes"] },
      { id: "cazetv", name: "CazéTV", category: "esportes", icon: "fa-bolt", color: "from-yellow-500 to-amber-700", routes: ["https://reidosembeds.online/embed/cazetv", "https://v2.rdembed.sbs/canal/cazetv", "https://embed.reidosembeds.online/canal/cazetv"] },
      { id: "sbt", name: "SBT", category: "abertos", icon: "fa-tv", color: "from-blue-500 to-cyan-700", routes: ["https://reidosembeds.online/embed/sbt", "https://v2.rdembed.sbs/canal/sbt", "https://embed.reidosembeds.online/canal/sbt"] },
      { id: "record-tv", name: "Record TV", category: "abertos", icon: "fa-tv", color: "from-purple-600 to-indigo-900", routes: ["https://reidosembeds.online/embed/record-tv", "https://v2.rdembed.sbs/canal/record-tv", "https://embed.reidosembeds.online/canal/record-tv"] },
      { id: "band", name: "Band", category: "abertos", icon: "fa-tv", color: "from-red-600 to-amber-700", routes: ["https://reidosembeds.online/embed/band", "https://v2.rdembed.sbs/canal/band", "https://embed.reidosembeds.online/canal/band"] },
      { id: "telecine-pipoca", name: "Telecine Pipoca", category: "filmes", icon: "fa-film", color: "from-rose-600 to-red-900", routes: ["https://reidosembeds.online/embed/telecine-pipoca", "https://v2.rdembed.sbs/canal/telecine-pipoca", "https://embed.reidosembeds.online/canal/telecine-pipoca"] },
      { id: "hbo", name: "HBO", category: "filmes", icon: "fa-clapperboard", color: "from-purple-700 to-violet-950", routes: ["https://reidosembeds.online/embed/hbo", "https://v2.rdembed.sbs/canal/hbo", "https://embed.reidosembeds.online/canal/hbo"] }
    ];

    auth.onAuthStateChanged((user) => {
      document.getElementById('appScreen').classList.replace('hidden', 'flex');
      switchTab('home');
    });

    function switchTab(tabName) {
      document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('nav-active'));
      const activeBtn = document.getElementById(`tab-${tabName}`);
      if (activeBtn) activeBtn.classList.add('nav-active');

      const allSections = ['heroSection', 'sectionTrending', 'sectionHomeMovies', 'sectionHomeSeries', 'sectionMovies', 'sectionSeries', 'sectionAnimes', 'sectionTV'];
      allSections.forEach(s => document.getElementById(s)?.classList.add('hidden'));

      if (tabName === 'home') {
        ['heroSection', 'sectionTrending', 'sectionHomeMovies', 'sectionHomeSeries'].forEach(s => document.getElementById(s)?.classList.remove('hidden'));
        loadFullHomeData();
      } else if (tabName === 'movies') {
        document.getElementById('sectionMovies')?.classList.remove('hidden');
        loadCatalogCategory('movie', 'gridMovies');
      } else if (tabName === 'series') {
        document.getElementById('sectionSeries')?.classList.remove('hidden');
        loadCatalogCategory('tv', 'gridSeries');
      } else if (tabName === 'animes') {
        document.getElementById('sectionAnimes')?.classList.remove('hidden');
        loadAnimeCategory('gridAnimes');
      } else if (tabName === 'tv') {
        document.getElementById('sectionTV')?.classList.remove('hidden');
        renderTVGrid();
      }
    }

    // GERA MÚLTIPLOS SERVIDORES PARA FILMES E SÉRIES (EVITA O ERRO 404)
    function playMovieOrSeries(tmdbId, title, isMovie = true) {
      const type = isMovie ? 'filme' : 'serie';
      activeMediaRoutes = [
        `https://superflixapi.dev/${type}/${tmdbId}`,
        `https://supercdn.org/${type}/${tmdbId}`,
        `https://superflixapi.top/${type}/${tmdbId}`
      ];
      activeMediaTitle = decodeURIComponent(title);
      activeMediaSubtitle = isMovie ? 'Filme' : 'Série';

      document.getElementById('serverRouteSelect').selectedIndex = 0;
      loadIframeUrl(activeMediaRoutes[0], activeMediaTitle, activeMediaSubtitle);
    }

    function playChannel(id) {
      const ch = CHANNELS.find(c => c.id === id);
      if (!ch) return;

      activeMediaRoutes = ch.routes;
      activeMediaTitle = ch.name;
      activeMediaSubtitle = 'TV ao Vivo';

      document.getElementById('serverRouteSelect').selectedIndex = 0;
      loadIframeUrl(activeMediaRoutes[0], activeMediaTitle, activeMediaSubtitle);
    }

    function changeServerRoute() {
      const idx = document.getElementById('serverRouteSelect').value;
      if (activeMediaRoutes[idx]) {
        loadIframeUrl(activeMediaRoutes[idx], activeMediaTitle, activeMediaSubtitle);
      }
    }

    function loadIframeUrl(embedUrl, title, subtitle) {
      document.getElementById('playerTitle').innerText = title;
      document.getElementById('playerSubtitle').innerText = subtitle || 'Player Principal';

      const holder = document.getElementById('iframeHolder');
      holder.innerHTML = '';

      const iframe = document.createElement('iframe');
      iframe.src = embedUrl;
      iframe.className = "w-full h-full border-0 relative z-10";
      iframe.allow = "autoplay; encrypted-media; fullscreen; picture-in-picture";
      iframe.setAttribute('allowfullscreen', 'true');
      holder.appendChild(iframe);

      const overlay = document.getElementById('playerOverlay');
      overlay.classList.replace('opacity-0', 'opacity-100');
      overlay.classList.replace('pointer-events-none', 'pointer-events-auto');
    }

    function closePlayer() {
      document.getElementById('iframeHolder').innerHTML = '';
      const overlay = document.getElementById('playerOverlay');
      overlay.classList.replace('opacity-100', 'opacity-0');
      overlay.classList.replace('pointer-events-auto', 'pointer-events-none');
    }

    async function loadFullHomeData() {
      try {
        const resTrend = await fetch(`https://api.themoviedb.org/3/trending/all/week?api_key=${TMDB_API_KEY}&language=pt-BR`);
        const dataTrend = await resTrend.json();
        if (dataTrend.results && dataTrend.results.length > 0) {
          const item = dataTrend.results[0];
          document.getElementById('heroBg').style.backgroundImage = `url('https://image.tmdb.org/t/p/original${item.backdrop_path}')`;
          document.getElementById('heroTitle').innerText = item.title || item.name;
          document.getElementById('heroOverview').innerText = item.overview || '';
          document.getElementById('heroPlayBtn').onclick = () => playMovieOrSeries(item.id, encodeURIComponent(item.title || item.name), item.media_type === 'movie');

          const grid = document.getElementById('gridTrending');
          grid.innerHTML = '';
          dataTrend.results.slice(1, 13).forEach(it => {
            const title = it.title || it.name;
            const poster = `https://image.tmdb.org/t/p/w500${it.poster_path}`;
            const div = document.createElement('div');
            div.className = "liquid-glass-card group relative overflow-hidden flex flex-col cursor-pointer";
            div.onclick = () => playMovieOrSeries(it.id, encodeURIComponent(title), it.media_type === 'movie');
            div.innerHTML = `
              <div class="aspect-[2/3] w-full bg-black/40 relative overflow-hidden rounded-t-2xl">
                <img src="${poster}" alt="${title}" loading="lazy" class="w-full h-full object-cover">
              </div>
              <div class="p-3 bg-black/30 rounded-b-2xl border-t border-white/10">
                <h4 class="font-bold text-xs text-white truncate">${title}</h4>
              </div>
            `;
            grid.appendChild(div);
          });
        }

        loadCatalogCategory('movie', 'gridHomeMovies');
        loadCatalogCategory('tv', 'gridHomeSeries');
      } catch (err) {}
    }

    async function loadCatalogCategory(type, gridId) {
      const grid = document.getElementById(gridId);
      if (!grid) return;
      grid.innerHTML = '';
      try {
        const res = await fetch(`https://api.themoviedb.org/3/${type}/popular?api_key=${TMDB_API_KEY}&language=pt-BR&page=1`);
        const data = await res.json();
        data.results.slice(0, 12).forEach(it => {
          const title = it.title || it.name;
          const poster = `https://image.tmdb.org/t/p/w500${it.poster_path}`;
          const div = document.createElement('div');
          div.className = "liquid-glass-card group relative overflow-hidden flex flex-col cursor-pointer";
          div.onclick = () => playMovieOrSeries(it.id, encodeURIComponent(title), type === 'movie');
          div.innerHTML = `
            <div class="aspect-[2/3] w-full bg-black/40 relative overflow-hidden rounded-t-2xl">
              <img src="${poster}" alt="${title}" loading="lazy" class="w-full h-full object-cover">
            </div>
            <div class="p-3 bg-black/30 rounded-b-2xl border-t border-white/10">
              <h4 class="font-bold text-xs text-white truncate">${title}</h4>
            </div>
          `;
          grid.appendChild(div);
        });
      } catch (e) {}
    }

    async function loadAnimeCategory(gridId) {
      const grid = document.getElementById(gridId);
      if (!grid) return;
      grid.innerHTML = '';
      try {
        const res = await fetch(`https://api.themoviedb.org/3/discover/tv?api_key=${TMDB_API_KEY}&language=pt-BR&with_genres=16&with_original_language=ja`);
        const data = await res.json();
        data.results.forEach(it => {
          const title = it.name;
          const poster = `https://image.tmdb.org/t/p/w500${it.poster_path}`;
          const div = document.createElement('div');
          div.className = "liquid-glass-card group relative overflow-hidden flex flex-col cursor-pointer";
          div.onclick = () => playMovieOrSeries(it.id, encodeURIComponent(title), false);
          div.innerHTML = `
            <div class="aspect-[2/3] w-full bg-black/40 relative overflow-hidden rounded-t-2xl">
              <img src="${poster}" alt="${title}" loading="lazy" class="w-full h-full object-cover">
            </div>
            <div class="p-3 bg-black/30 rounded-b-2xl border-t border-white/10">
              <h4 class="font-bold text-xs text-white truncate">${title}</h4>
            </div>
          `;
          grid.appendChild(div);
        });
      } catch (e) {}
    }

    function renderTVGrid() {
      const grid = document.getElementById('gridTVChannels');
      if (!grid) return;
      grid.innerHTML = '';

      CHANNELS.forEach(ch => {
        const div = document.createElement('div');
        div.className = "liquid-glass-card group relative overflow-hidden flex flex-col cursor-pointer border-rose-500/20 hover:border-rose-500/80 transition shadow-lg";
        div.onclick = () => playChannel(ch.id);

        div.innerHTML = `
          <div class="aspect-video w-full bg-gradient-to-br ${ch.color} relative overflow-hidden rounded-t-2xl flex items-center justify-center p-3">
            <div class="absolute top-2 left-2 z-20">
              <span class="badge-capa text-[9px] font-extrabold px-2 py-0.5 rounded-lg text-rose-400 flex items-center gap-1">
                <span class="w-1.5 h-1.5 rounded-full bg-rose-500 animate-pulse"></span> AO VIVO
              </span>
            </div>

            <div class="text-center flex flex-col items-center gap-1 text-white">
              <i class="fa-solid ${ch.icon} text-3xl text-rose-400 drop-shadow-md"></i>
              <span class="text-xs font-black tracking-wider uppercase mt-1">${ch.name}</span>
            </div>
          </div>

          <div class="p-3 bg-black/40 rounded-b-2xl border-t border-white/10">
            <h4 class="font-bold text-xs text-white truncate">${ch.name}</h4>
          </div>
        `;
        grid.appendChild(div);
      });
    }

    function logout() { auth.signOut(); }
  </script>
</body>
</html>
