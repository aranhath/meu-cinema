<!DOCTYPE html>
<html lang="pt-br" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meu Cinema & Séries - Catalog Player</title>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#e50914', 600: '#b81d24' }
          }
        }
      }
    }
  </script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <!-- Firebase SDK (v9 Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    body { background-color: #0f0f0f; color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .glass { background: rgba(24, 24, 27, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-brand-500 selection:text-white">

  <!-- TOP HEADER -->
  <header class="sticky top-0 z-40 border-b border-zinc-800/80 glass px-4 py-3 sm:px-8 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-brand-500 flex items-center justify-center text-white font-black text-xl shadow-lg shadow-brand-500/30">
        <i class="fa-solid fa-play text-sm"></i>
      </div>
      <div>
        <h1 class="font-bold text-lg leading-none tracking-tight text-white">Meu Cinema</h1>
        <p class="text-[11px] text-zinc-400 font-medium flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          Sincronizado na Nuvem
        </p>
      </div>
    </div>

    <div class="flex items-center gap-2 sm:gap-3">
      <button onclick="openModal()" class="px-3 py-1.5 text-xs sm:text-sm font-semibold rounded-lg bg-brand-500 hover:bg-brand-600 text-white shadow-lg shadow-brand-500/20 transition flex items-center gap-1.5">
        <i class="fa-solid fa-plus"></i>
        <span>Adicionar Título</span>
      </button>
    </div>
  </header>

  <!-- MAIN CATALOG -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6 sm:px-8 space-y-6">
    <!-- SEARCH & FILTERS -->
    <div class="flex flex-col sm:flex-row gap-3 items-stretch sm:items-center justify-between">
      <div class="relative flex-1 max-w-md">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-zinc-500 text-sm"></i>
        <input type="text" id="searchInput" oninput="renderCatalog()" placeholder="Buscar filme, série ou anime..." class="w-full bg-zinc-900 border border-zinc-800 rounded-xl pl-10 pr-4 py-2 text-sm text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-brand-500 transition">
      </div>
      <div class="flex items-center gap-2 overflow-x-auto hide-scrollbar py-1">
        <button onclick="setFilter('ALL')" id="filter-ALL" class="px-3 py-1.5 rounded-lg text-xs font-medium border border-brand-500 bg-brand-500/10 text-brand-500 whitespace-nowrap">Todos</button>
        <button onclick="setFilter('Filme')" id="filter-Filme" class="px-3 py-1.5 rounded-lg text-xs font-medium border border-zinc-800 bg-zinc-900 text-zinc-400 hover:text-zinc-200 whitespace-nowrap">Filmes</button>
        <button onclick="setFilter('Série')" id="filter-Série" class="px-3 py-1.5 rounded-lg text-xs font-medium border border-zinc-800 bg-zinc-900 text-zinc-400 hover:text-zinc-200 whitespace-nowrap">Séries</button>
        <button onclick="setFilter('Anime')" id="filter-Anime" class="px-3 py-1.5 rounded-lg text-xs font-medium border border-zinc-800 bg-zinc-900 text-zinc-400 hover:text-zinc-200 whitespace-nowrap">Animes</button>
      </div>
    </div>

    <!-- CARDS GRID -->
    <div id="catalogGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
      <!-- Generated Dynamically -->
    </div>

    <!-- EMPTY STATE -->
    <div id="emptyState" class="hidden flex-col items-center justify-center py-20 text-center space-y-3">
      <div class="w-16 h-16 rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center text-zinc-600 text-2xl">
        <i class="fa-solid fa-film"></i>
      </div>
      <p class="text-zinc-400 font-medium text-sm">Nenhum título encontrado.</p>
      <p class="text-xs text-zinc-600 max-w-xs">Adicione títulos com seus links de API para assistir em qualquer dispositivo.</p>
    </div>
  </main>

  <!-- ADD/EDIT MODAL -->
  <div id="modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-2xl relative max-h-[90vh] overflow-y-auto">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-zinc-500 hover:text-zinc-300 text-lg">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <h3 id="modalTitle" class="text-lg font-bold text-white">Adicionar Novo Título</h3>

      <form id="itemForm" onsubmit="saveItem(event)" class="space-y-4">
        <input type="hidden" id="itemId">

        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-1">Título</label>
          <input type="text" id="titleInput" required placeholder="Ex: Attack on Titan" class="w-full bg-zinc-800 border border-zinc-700/60 rounded-xl px-3.5 py-2 text-sm text-zinc-200 focus:outline-none focus:border-brand-500">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-zinc-400 mb-1">Tipo</label>
            <select id="typeInput" onchange="toggleEpisodeField()" class="w-full bg-zinc-800 border border-zinc-700/60 rounded-xl px-3.5 py-2 text-sm text-zinc-200 focus:outline-none focus:border-brand-500">
              <option value="Filme">Filme</option>
              <option value="Série">Série</option>
              <option value="Anime">Anime</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-zinc-400 mb-1">URL da Capa (Opcional)</label>
            <input type="url" id="bannerInput" placeholder="https://..." class="w-full bg-zinc-800 border border-zinc-700/60 rounded-xl px-3.5 py-2 text-sm text-zinc-200 focus:outline-none focus:border-brand-500">
          </div>
        </div>

        <div id="noteContainer" class="hidden">
          <label class="block text-xs font-semibold text-zinc-400 mb-1">Anotação da Temporada / Progresso (Opcional)</label>
          <input type="text" id="noteInput" placeholder="Ex: Temporada 2" class="w-full bg-zinc-800 border border-zinc-700/60 rounded-xl px-3.5 py-2 text-sm text-zinc-200 focus:outline-none focus:border-brand-500">
        </div>

        <div id="singleApiContainer">
          <label class="block text-xs font-semibold text-zinc-400 mb-1">Código iframe OU Link da API</label>
          <textarea id="apiInput" rows="3" placeholder="Cole aqui o <iframe src='https://...'> ou a URL direta da API" class="w-full bg-zinc-800 border border-zinc-700/60 rounded-xl p-3 text-xs text-zinc-200 font-mono focus:outline-none focus:border-brand-500"></textarea>
        </div>

        <div id="episodesContainer" class="hidden space-y-2">
          <label class="block text-xs font-semibold text-zinc-400">Episódios (1 Link ou iframe por linha)</label>
          <textarea id="episodesInput" rows="5" placeholder="https://superflixapi.sbs/anime/1429&#10;https://superflixapi.sbs/anime/1429" class="w-full bg-zinc-800 border border-zinc-700/60 rounded-xl p-3 text-xs text-zinc-200 font-mono focus:outline-none focus:border-brand-500"></textarea>
          <p class="text-[10px] text-zinc-500">Cada linha corresponderá a um episódio na ordem (Ep. 1, Ep. 2...).</p>
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeModal()" class="px-4 py-2 text-xs font-semibold rounded-xl border border-zinc-700 text-zinc-300 hover:bg-zinc-800">Cancelar</button>
          <button type="submit" class="px-4 py-2 text-xs font-semibold rounded-xl bg-brand-500 hover:bg-brand-600 text-white shadow-lg shadow-brand-500/20">Salvar na Nuvem</button>
        </div>
      </form>
    </div>
  </div>

  <!-- PLAYER OVERLAY LAYER -->
  <div id="playerOverlay" class="fixed inset-0 z-50 bg-black hidden flex-col">
    <div id="playerHeader" class="absolute top-0 left-0 right-0 z-50 p-3 sm:p-4 bg-gradient-to-b from-black/90 to-transparent flex items-center justify-between transition-opacity duration-300">
      <div class="flex items-center gap-3">
        <button onclick="closePlayer()" class="w-9 h-9 rounded-full bg-zinc-900/80 hover:bg-zinc-800 border border-zinc-700/60 text-white flex items-center justify-center transition">
          <i class="fa-solid fa-arrow-left text-sm"></i>
        </button>
        <div>
          <h2 id="playerTitle" class="text-sm sm:text-base font-bold text-white leading-tight">...</h2>
          <p id="playerSubtitle" class="text-xs text-zinc-400 font-medium"></p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <select id="episodeSelect" onchange="changeEpisode(this.value)" class="hidden bg-zinc-900/90 border border-zinc-700 text-xs text-zinc-200 rounded-lg px-2.5 py-1.5 focus:outline-none">
        </select>
        <button onclick="closePlayer()" class="text-xs px-3 py-1.5 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded-lg border border-zinc-700 transition">Sair</button>
      </div>
    </div>

    <div id="iframeHolder" class="w-full h-full"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyC2NZ67Uh1biKo27WvRoT5B41GLMOUM0xo",
      authDomain: "meu-cinema-931ad.firebaseapp.com",
      databaseURL: "https://meu-cinema-931ad-default-rtdb.firebaseio.com",
      projectId: "meu-cinema-931ad",
      storageBucket: "meu-cinema-931ad.firebasestorage.app",
      messagingSenderId: "217991334157",
      appId: "1:217991334157:web:cba2f7f21f0a835d750844",
      measurementId: "G-DRWSVHV215"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const catalogRef = db.ref('catalog');

    let catalog = [];
    let currentFilter = 'ALL';

    catalogRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        catalog = Object.keys(data).map(key => ({ id: key, ...data[key] }));
      } else {
        catalog = [];
      }
      renderCatalog();
    });

    // PARSER RIGOROSO DE URL (Evita corromper links com aspas ou barras extras)
    function parseApiUrl(raw) {
      if (!raw) return '';
      let str = raw.trim();
      
      // Extrai a URL se for uma tag <iframe src="...">
      if (str.includes('src=')) {
        const match = str.match(/src=["']([^"']+)["']/i);
        if (match && match[1]) str = match[1];
      }

      // Remove aspas simples ou duplas acidentais nas pontas
      str = str.replace(/^["']|["']$/g, '').trim();

      // Força HTTPS se começar com HTTP
      if (str.startsWith('http://')) {
        str = str.replace('http://', 'https://');
      }

      return str;
    }

    function setFilter(type) {
      currentFilter = type;
      ['ALL', 'Filme', 'Série', 'Anime'].forEach(t => {
        const btn = document.getElementById(`filter-${t}`);
        if (t === type) {
          btn.className = "px-3 py-1.5 rounded-lg text-xs font-medium border border-brand-500 bg-brand-500/10 text-brand-500 whitespace-nowrap";
        } else {
          btn.className = "px-3 py-1.5 rounded-lg text-xs font-medium border border-zinc-800 bg-zinc-900 text-zinc-400 hover:text-zinc-200 whitespace-nowrap";
        }
      });
      renderCatalog();
    }

    function renderCatalog() {
      const grid = document.getElementById('catalogGrid');
      const empty = document.getElementById('emptyState');
      const search = document.getElementById('searchInput').value.toLowerCase();

      grid.innerHTML = '';

      const filtered = catalog.filter(item => {
        const matchesType = currentFilter === 'ALL' || item.type === currentFilter;
        const matchesSearch = item.title.toLowerCase().includes(search);
        return matchesType && matchesSearch;
      });

      if (filtered.length === 0) {
        empty.classList.remove('hidden');
        empty.classList.add('flex');
      } else {
        empty.classList.add('hidden');
        empty.classList.remove('flex');

        filtered.forEach(item => {
          const defaultBanner = 'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=600&q=80';
          const card = document.createElement('div');
          card.className = "group relative bg-zinc-900/60 border border-zinc-800/80 rounded-xl overflow-hidden hover:border-zinc-700 transition flex flex-col cursor-pointer";
          
          let progressBadge = '';
          if (item.type !== 'Filme') {
            const lastEp = (item.lastEpisodeIndex !== undefined) ? (item.lastEpisodeIndex + 1) : 1;
            const noteText = item.seasonNote ? `${item.seasonNote} • ` : '';
            progressBadge = `<span class="absolute bottom-2 left-2 text-[10px] font-semibold px-2 py-0.5 rounded bg-zinc-900/90 border border-zinc-700/80 text-emerald-400 shadow"><i class="fa-solid fa-bookmark text-[9px] mr-1"></i>${noteText}Ep. ${lastEp}</span>`;
          }

          card.innerHTML = `
            <div class="aspect-[2/3] w-full bg-zinc-800 relative overflow-hidden" onclick="playItem('${item.id}')">
              <img src="${item.banner || defaultBanner}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" onerror="this.src='${defaultBanner}'">
              <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition flex items-center justify-center">
                <div class="w-12 h-12 rounded-full bg-brand-500 text-white flex items-center justify-center shadow-lg shadow-brand-500/40">
                  <i class="fa-solid fa-play text-lg ml-0.5"></i>
                </div>
              </div>
              <span class="absolute top-2 left-2 text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-black/60 backdrop-blur-md border border-white/10 text-zinc-300">${item.type}</span>
              ${progressBadge}
            </div>
            <div class="p-3 flex items-start justify-between gap-2">
              <div onclick="playItem('${item.id}')" class="flex-1 min-w-0">
                <h4 class="font-semibold text-xs text-zinc-200 truncate group-hover:text-brand-500 transition">${item.title}</h4>
                <p class="text-[10px] text-zinc-500 mt-0.5">${item.episodes ? item.episodes.length + ' Episódios' : 'Filme Completo'}</p>
              </div>
              <div class="flex items-center gap-1">
                <button onclick="editItem('${item.id}', event)" title="Editar / Anotar" class="text-zinc-600 hover:text-zinc-300 text-xs p-1">
                  <i class="fa-solid fa-pen"></i>
                </button>
                <button onclick="deleteItem('${item.id}', event)" title="Excluir" class="text-zinc-600 hover:text-red-400 text-xs p-1">
                  <i class="fa-solid fa-trash"></i>
                </button>
              </div>
            </div>
          `;
          grid.appendChild(card);
        });
      }
    }

    function toggleEpisodeField() {
      const type = document.getElementById('typeInput').value;
      const single = document.getElementById('singleApiContainer');
      const multi = document.getElementById('episodesContainer');
      const note = document.getElementById('noteContainer');

      if (type === 'Filme') {
        single.classList.remove('hidden');
        multi.classList.add('hidden');
        note.classList.add('hidden');
      } else {
        single.classList.add('hidden');
        multi.classList.remove('hidden');
        note.classList.remove('hidden');
      }
    }

    function openModal() {
      document.getElementById('itemForm').reset();
      document.getElementById('itemId').value = '';
      document.getElementById('modalTitle').innerText = 'Adicionar Novo Título';
      toggleEpisodeField();
      document.getElementById('modal').classList.remove('hidden');
    }

    function editItem(id, e) {
      e.stopPropagation();
      const item = catalog.find(i => i.id === id);
      if (!item) return;

      document.getElementById('itemId').value = item.id;
      document.getElementById('titleInput').value = item.title;
      document.getElementById('typeInput').value = item.type;
      document.getElementById('bannerInput').value = item.banner || '';
      document.getElementById('noteInput').value = item.seasonNote || '';
      
      toggleEpisodeField();

      if (item.type === 'Filme') {
        document.getElementById('apiInput').value = item.apiUrl || '';
      } else {
        document.getElementById('episodesInput').value = (item.episodes || []).join('\n');
      }

      document.getElementById('modalTitle').innerText = 'Editar Título / Anotações';
      document.getElementById('modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
    }

    function saveItem(e) {
      e.preventDefault();
      const id = document.getElementById('itemId').value || db.ref('catalog').push().key;
      const title = document.getElementById('titleInput').value.trim();
      const type = document.getElementById('typeInput').value;
      const banner = document.getElementById('bannerInput').value.trim();
      const seasonNote = document.getElementById('noteInput').value.trim();

      const existingItem = catalog.find(i => i.id === id) || {};

      let itemData = { 
        title, 
        type, 
        banner, 
        seasonNote,
        lastEpisodeIndex: existingItem.lastEpisodeIndex !== undefined ? existingItem.lastEpisodeIndex : 0
      };

      if (type === 'Filme') {
        itemData.apiUrl = parseApiUrl(document.getElementById('apiInput').value);
      } else {
        const rawEps = document.getElementById('episodesInput').value.split('\n');
        itemData.episodes = rawEps.map(line => parseApiUrl(line)).filter(url => url.length > 0);
      }

      db.ref(`catalog/${id}`).set(itemData, (error) => {
        if (!error) {
          closeModal();
        } else {
          alert('Erro ao salvar no banco de dados. Verifique as Regras do Realtime Database.');
        }
      });
    }

    function deleteItem(id, e) {
      e.stopPropagation();
      if (confirm('Deseja excluir este título do catálogo na nuvem?')) {
        db.ref(`catalog/${id}`).remove();
      }
    }

    let activeItem = null;

    function playItem(id) {
      activeItem = catalog.find(i => i.id === id);
      if (!activeItem) return;

      document.getElementById('playerTitle').innerText = activeItem.title;
      const select = document.getElementById('episodeSelect');

      if (activeItem.type !== 'Filme' && activeItem.episodes && activeItem.episodes.length > 0) {
        select.classList.remove('hidden');
        select.innerHTML = '';
        
        activeItem.episodes.forEach((url, index) => {
          const opt = document.createElement('option');
          opt.value = index;
          opt.innerText = `Episódio ${index + 1}`;
          select.appendChild(opt);
        });

        const startEpIndex = activeItem.lastEpisodeIndex || 0;
        select.value = startEpIndex;
        loadIframe(activeItem.episodes[startEpIndex], `Episódio ${startEpIndex + 1}`);
      } else {
        select.classList.add('hidden');
        loadIframe(activeItem.apiUrl, 'Filme Completo');
      }

      document.getElementById('playerOverlay').classList.remove('hidden');
      document.getElementById('playerOverlay').classList.add('flex');
    }

    function changeEpisode(index) {
      const epIndex = parseInt(index);
      if (activeItem && activeItem.episodes[epIndex] !== undefined) {
        loadIframe(activeItem.episodes[epIndex], `Episódio ${epIndex + 1}`);
        
        activeItem.lastEpisodeIndex = epIndex;
        db.ref(`catalog/${activeItem.id}/lastEpisodeIndex`).set(epIndex);
      }
    }

    function loadIframe(url, subtitle) {
      document.getElementById('playerSubtitle').innerText = subtitle;
      const holder = document.getElementById('iframeHolder');
      holder.innerHTML = '';

      if (!url) {
        holder.innerHTML = `<div class="w-full h-full flex items-center justify-center text-zinc-500 text-sm">URL da API não configurada.</div>`;
        return;
      }

      const iframe = document.createElement('iframe');
      iframe.src = url;
      iframe.className = "w-full h-full border-0";
      iframe.referrerPolicy = "no-referrer";
      iframe.allow = "autoplay *; encrypted-media *; picture-in-picture *; fullscreen *; clipboard-write *; accelerometer *; gyroscope *";
      iframe.setAttribute('allowfullscreen', 'true');
      iframe.setAttribute('webkitallowfullscreen', 'true');
      iframe.setAttribute('mozallowfullscreen', 'true');

      holder.appendChild(iframe);
    }

    function closePlayer() {
      const holder = document.getElementById('iframeHolder');
      holder.innerHTML = '';
      document.getElementById('playerOverlay').classList.add('hidden');
      document.getElementById('playerOverlay').classList.remove('flex');
      activeItem = null;
    }
  </script>
</body>
</html>
