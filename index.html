  <script src="Compreendido! Identifiquei o problema exato pelas capturas de tela: no painel de resultados da busca global, a lista só exibe o botão vermelho **"Assistir"**, sem dar a opção de adicionar o item ao seu **Catálogo Salvo**. 

Além disso, para deixar o fluxo mais intuitivo no computador e no celular, criei um **indicador dinâmico** na busca (que avisa se o item já está salvo ou não) e um atalho direto para acessar o seu catálogo.

---

### 🛠️ O que foi implementado no código:

1. **Botão "Salvar / Remover" na Busca Global**:
   * Agora cada resultado da busca exibe um botão de **Salvar** (com ícone de bandeira/bookmark) ao lado do botão "Assistir".
   * Se o filme ou série já estiver no seu catálogo, o botão muda automaticamente para verde com o status **"Salvo"** (e permite remover com 1 clique se desejar).
2. **Atualização Dinâmica e Instantânea**:
   * Assim que você clica para salvar um filme ou série na busca, ele é sincronizado no Firebase e o botão já reflete a mudança sem precisar fechar a janela ou recarregar a página.
3. **Mecanismo de Verificação de Duplicatas**:
   * O sistema checa se o `tmdbId` ou o título já existem na sua conta antes de salvar, evitando que o mesmo filme seja duplicado na sua lista.
