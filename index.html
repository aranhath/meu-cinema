<!DOCTYPE html>
<html lang="pt-br" class="dark">
<head>

  <!-- Tailwind CSS & FontAwesome -->

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#e50914', 600: '#b81d24' }
          }
        }
      }

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <style>
    html, body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 0%, #1a0b2e 0%, #08090c 60%, #030406 100%);
      background-attachment: fixed;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
      overscroll-behavior-y: none;
      -webkit-user-select: none;
      user-select: none;
    }

    input, select, textarea {
      font-size: 16px !important;
      -webkit-text-size-adjust: 100%;
      user-select: text;
    }

    .liquid-glass {
      background: rgba(22, 24, 34, 0.95);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), inset 0 1px 1px rgba(255, 255, 255, 0.2);
    }

    .liquid-glass-card {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.01) 100%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1.25rem;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .liquid-glass-card:hover {
      transform: translateY(-6px) scale(1.02);
      border-color: rgba(229, 9, 20, 0.5);
      box-shadow: 0 20px 40px -10px rgba(229, 9, 20, 0.3), inset 0 1px 2px rgba(255, 255, 255, 0.4);
    }

    .badge-capa {
      background: rgba(10, 10, 15, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    .nav-active {
      background: linear-gradient(135deg, rgba(229, 9, 20, 0.3) 0%, rgba(229, 9, 20, 0.1) 100%) !important;
      color: #ffffff !important;
      border: 1px solid rgba(229, 9, 20, 0.6) !important;
      box-shadow: 0 8px 20px rgba(229, 9, 20, 0.25), inset 0 1px 1px rgba(255, 255, 255, 0.3) !important;
      font-weight: 800 !important;
    }

    .genre-btn-active {
      background: rgba(229, 9, 20, 0.85) !important;
      color: #ffffff !important;
      border-color: rgba(255, 255, 255, 0.3) !important;
      box-shadow: 0 8px 20px rgba(229, 9, 20, 0.3) !important;
    }

    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-brand-500 selection:text-white relative">

  <div class="fixed bottom-0 right-1/4 w-96 h-96 bg-purple-600/10 rounded-full blur-[120px] pointer-events-none z-0"></div>

  <div id="searchBackdrop" onclick="clearGlobalSearch()" class="fixed inset-0 bg-transparent z-30 pointer-events-none"></div>

  <div id="appScreen" class="flex flex-col min-h-screen relative z-10">

        <nav class="hidden md:flex items-center gap-1.5 ml-4">

          <button onclick="switchTab('tv')" id="tab-tv" class="nav-tab px-3.5 py-2 rounded-2xl text-xs font-semibold text-zinc-300 hover:text-white transition cursor-pointer flex items-center gap-1.5">

            <span>TV ao Vivo</span>

    </header>

    <!-- MENU MOBILE -->
    <div class="md:hidden flex items-center justify-between bg-black/50 border-b border-white/10 px-3 py-2.5 overflow-x-auto hide-scrollbar backdrop-blur-xl">
      <button onclick="switchTab('home')" class="px-3 py-1.5 text-xs font-bold text-white whitespace-nowrap rounded-xl bg-white/10">Início</button>
      <button onclick="switchTab('tv')" class="px-3 py-1.5 text-xs font-bold text-rose-400 bg-rose-950/40 border border-rose-500/30 rounded-xl whitespace-nowrap flex items-center gap-1">
        <i class="fa-solid fa-tv text-[10px]"></i> TV ao Vivo
      </button>
    </div>

    <!-- MAIN BODY -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6 sm:px-8 space-y-8">

      <!-- BARRA DE BUSCA GLOBAL -->
      <div class="relative z-30">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-zinc-300 text-sm"></i>
          <input type="search" id="globalSearchInput" onkeyup="handleGlobalSearch(event)" placeholder="Buscar canais ao vivo, filmes e séries..." autocomplete="off" class="w-full bg-[#181a26] border-2 border-brand-500/60 rounded-2xl pl-11 pr-12 py-3.5 text-base text-white focus:outline-none focus:border-brand-500 transition font-bold shadow-2xl">
          <button id="clearSearchBtn" onclick="clearGlobalSearch()" class="hidden absolute right-3 top-1/2 -translate-y-1/2 w-8 h-8 rounded-xl bg-white/20 hover:bg-white/30 text-white flex items-center justify-center text-xs transition cursor-pointer">
            <i class="fa-solid fa-xmark"></i>

        </div>

        <div id="searchResultsPanel" class="opacity-0 translate-y-2 pointer-events-none transition-all duration-200 absolute left-0 right-0 top-full mt-3 bg-[#181a26] border-2 border-zinc-700/80 rounded-3xl shadow-2xl max-h-[75vh] overflow-y-auto p-3.5 sm:p-5 space-y-4 z-50">

      <!-- HERO BANNER -->
      <section id="heroSection" class="relative rounded-3xl overflow-hidden liquid-glass min-h-[280px] sm:min-h-[360px] flex items-end p-6 sm:p-10 border border-white/15 shadow-2xl">

            Destaque em Alta

          <h2 id="heroTitle" class="text-2xl sm:text-4xl font-black text-white leading-tight">Carregando...</h2>
          <p id="heroOverview" class="text-xs sm:text-sm text-zinc-300 line-clamp-2 font-medium"></p>
          <div class="flex items-center gap-3 pt-2">
            <button id="heroPlayBtn" class="px-6 py-3 bg-brand-500 hover:bg-brand-600 text-white font-bold text-xs rounded-2xl shadow-xl shadow-brand-500/30 transition flex items-center gap-2 cursor-pointer">
              <i class="fa-solid fa-play"></i> Assistir Agora

          </div>
        </div>
      </section>

      <!-- HOME -->
      <section id="sectionTrending" class="space-y-3">
        <div class="flex items-center justify-between border-b border-white/10 pb-2">
          <h2 class="text-base font-black text-white uppercase tracking-wider flex items-center gap-2">
            <i class="fa-solid fa-fire text-brand-500"></i> Em Alta na Semana

        <div id="gridTrending" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4"></div>
      </section>

      <!-- TV AO VIVO -->
      <section id="sectionTV" class="hidden space-y-6">
        <div class="liquid-glass p-6 rounded-3xl space-y-4">
          <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 border-b border-white/10 pb-3">
            <div>
              <h2 class="text-xl font-black text-white uppercase tracking-wider flex items-center gap-2">
                <i class="fa-solid fa-satellite-dish text-rose-500 animate-pulse"></i> Grade Completa de TV ao Vivo
              </h2>
              <p class="text-xs text-zinc-400">Todos os canais com resolução de embed dinâmica sem erro 404</p>
            </div>
          </div>

          <div class="flex items-center gap-2 overflow-x-auto hide-scrollbar pb-1" id="tvFilterButtons">
            <button onclick="filterTVCategory('all', this)" class="genre-btn genre-btn-active px-4 py-2 rounded-2xl border border-white/10 text-xs font-bold transition whitespace-nowrap">Todos os Canais</button>
            <button onclick="filterTVCategory('esportes', this)" class="genre-btn bg-white/5 hover:bg-white/10 px-4 py-2 rounded-2xl border border-white/10 text-xs font-semibold text-zinc-300 transition whitespace-nowrap">Esportes</button>
            <button onclick="filterTVCategory('abertos', this)" class="genre-btn bg-white/5 hover:bg-white/10 px-4 py-2 rounded-2xl border border-white/10 text-xs font-semibold text-zinc-300 transition whitespace-nowrap">Gerais / Abertos</button>
            <button onclick="filterTVCategory('filmes', this)" class="genre-btn bg-white/5 hover:bg-white/10 px-4 py-2 rounded-2xl border border-white/10 text-xs font-semibold text-zinc-300 transition whitespace-nowrap">Filmes & Séries</button>
          </div>
        </div>

        <div class="space-y-3">
          <div id="gridTVChannels" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4"></div>
        </div>
      </section>

    </main>
  </div>

  <!-- PLAYER OVERLAY -->
  <div id="playerOverlay" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-2xl opacity-0 pointer-events-none transition-opacity duration-300 flex flex-col">
    <div id="playerHeader" class="absolute top-4 right-4 z-50 flex items-center gap-2 bg-black/80 border border-white/15 p-2 rounded-2xl shadow-2xl backdrop-blur-xl">
      <div class="hidden sm:block px-3 text-left">
        <h2 id="playerTitle" class="text-xs font-bold text-white truncate max-w-[180px]">...</h2>
        <p id="playerSubtitle" class="text-[10px] text-zinc-400 font-medium"></p>
      </div>

      <button onclick="closePlayer()" title="Fechar Player" class="px-4 py-2 bg-brand-500 hover:bg-brand-600 text-white font-semibold text-xs rounded-xl shadow-lg shadow-brand-500/30 transition flex items-center gap-1.5 cursor-pointer">
        <i class="fa-solid fa-xmark"></i>
        <span>Sair</span>
      </button>
    </div>

    <div id="iframeHolder" class="w-full h-full relative"></div>
  </div>

  <script>
    // BASE DE DADOS COMPLETA COM MAIS DE 30 CANAIS
    let CHANNELS_DATABASE = [
      // Abertos & Regionais
      { id: "globo-rj", name: "Globo RJ", category: "abertos", icon: "fa-tv", color: "from-blue-600 to-indigo-800" },
      { id: "globo-sp", name: "Globo SP", category: "abertos", icon: "fa-tv", color: "from-blue-700 to-indigo-900" },
      { id: "globo-df", name: "Globo DF", category: "abertos", icon: "fa-tv", color: "from-blue-800 to-indigo-950" },
      { id: "globo-mg", name: "Globo MG", category: "abertos", icon: "fa-tv", color: "from-indigo-600 to-blue-900" },
      { id: "sbt", name: "SBT", category: "abertos", icon: "fa-tv", color: "from-blue-500 to-cyan-700" },
      { id: "record-tv", name: "Record TV", category: "abertos", icon: "fa-tv", color: "from-purple-600 to-indigo-900" },
      { id: "band", name: "Band", category: "abertos", icon: "fa-tv", color: "from-red-600 to-amber-700" },
      { id: "redetv", name: "RedeTV!", category: "abertos", icon: "fa-tv", color: "from-emerald-600 to-teal-900" },
      { id: "tv-cultura", name: "TV Cultura", category: "abertos", icon: "fa-tv", color: "from-green-600 to-emerald-900" },

      // Esportes
      { id: "sportv", name: "SporTV 1", category: "esportes", icon: "fa-futbol", color: "from-green-600 to-emerald-800" },
      { id: "sportv-2", name: "SporTV 2", category: "esportes", icon: "fa-futbol", color: "from-green-700 to-teal-900" },
      { id: "sportv-3", name: "SporTV 3", category: "esportes", icon: "fa-futbol", color: "from-emerald-600 to-green-900" },
      { id: "espn", name: "ESPN 1", category: "esportes", icon: "fa-trophy", color: "from-red-600 to-rose-900" },
      { id: "espn-2", name: "ESPN 2", category: "esportes", icon: "fa-trophy", color: "from-red-700 to-rose-950" },
      { id: "espn-3", name: "ESPN 3", category: "esportes", icon: "fa-trophy", color: "from-rose-700 to-red-900" },
      { id: "espn-4", name: "ESPN 4", category: "esportes", icon: "fa-trophy", color: "from-rose-800 to-amber-950" },
      { id: "premiere-clubes", name: "Premiere Clubes", category: "esportes", icon: "fa-shirt", color: "from-green-500 to-emerald-700" },
      { id: "premiere-2", name: "Premiere 2", category: "esportes", icon: "fa-shirt", color: "from-green-600 to-emerald-800" },
      { id: "premiere-3", name: "Premiere 3", category: "esportes", icon: "fa-shirt", color: "from-green-700 to-emerald-900" },
      { id: "cazetv", name: "CazéTV", category: "esportes", icon: "fa-bolt", color: "from-yellow-500 to-amber-700" },
      { id: "combate", name: "Combate", category: "esportes", icon: "fa-hand-fist", color: "from-red-800 to-zinc-950" },
      { id: "band-sports", name: "BandSports", category: "esportes", icon: "fa-futbol", color: "from-green-800 to-emerald-950" },

      // Filmes & Séries
      { id: "telecine-premium", name: "Telecine Premium", category: "filmes", icon: "fa-film", color: "from-rose-600 to-red-900" },
      { id: "telecine-pipoca", name: "Telecine Pipoca", category: "filmes", icon: "fa-film", color: "from-rose-600 to-red-900" },
      { id: "telecine-action", name: "Telecine Action", category: "filmes", icon: "fa-film", color: "from-red-700 to-amber-900" },
      { id: "telecine-touch", name: "Telecine Touch", category: "filmes", icon: "fa-film", color: "from-rose-700 to-pink-950" },
      { id: "hbo", name: "HBO", category: "filmes", icon: "fa-clapperboard", color: "from-purple-700 to-violet-950" },
      { id: "hbo-2", name: "HBO 2", category: "filmes", icon: "fa-clapperboard", color: "from-purple-800 to-indigo-950" },
      { id: "tnt", name: "TNT", category: "filmes", icon: "fa-film", color: "from-pink-600 to-rose-900" },
      { id: "megapix", name: "Megapix", category: "filmes", icon: "fa-film", color: "from-amber-600 to-red-900" },
      { id: "space", name: "Space", category: "filmes", icon: "fa-film", color: "from-zinc-700 to-zinc-900" },
      { id: "universal-tv", name: "Universal TV", category: "filmes", icon: "fa-tv", color: "from-blue-600 to-slate-900" },
      { id: "warner-channel", name: "Warner Channel", category: "filmes", icon: "fa-tv", color: "from-blue-700 to-indigo-950" }
    ];

    const TMDB_API_KEY = "15d2ea6d0dc1d476efbca3eba2b9bbfb";
    let tvCategory = 'all';

    window.addEventListener('DOMContentLoaded', () => {
      loadFullHomeData();
      syncChannelsFromApi();
    });

    // Sincroniza dinamicamente novos canais da API caso disponíveis
    async function syncChannelsFromApi() {
      try {
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent('https://reidosembeds.online/api/channels')}`;
        const res = await fetch(proxyUrl);
        const data = await res.json();
        
        if (Array.isArray(data) && data.length > 0) {
          data.forEach(remoteCh => {
            const slug = remoteCh.id || remoteCh.slug || remoteCh.name.toLowerCase().replace(/\s+/g, '-');
            const exists = CHANNELS_DATABASE.some(c => c.id === slug);
            if (!exists) {
              CHANNELS_DATABASE.push({
                id: slug,
                name: remoteCh.name || remoteCh.title,
                category: remoteCh.category || 'abertos',
                icon: 'fa-tv',
                color: 'from-zinc-800 to-zinc-950'
              });
            }
          });
        }
      } catch (e) {
        console.log("Mantendo banco otimizado de canais...");
      }
      if (!document.getElementById('sectionTV').classList.contains('hidden')) {
        renderTVGrid();
      }
    }

    function switchTab(tabName) {
      document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('nav-active'));
      const activeBtn = document.getElementById(`tab-${tabName}`);
      if (activeBtn) activeBtn.classList.add('nav-active');

      const allSections = ['heroSection', 'sectionTrending', 'sectionTV'];
      allSections.forEach(s => document.getElementById(s)?.classList.add('hidden'));

      if (tabName === 'home') {
        ['heroSection', 'sectionTrending'].forEach(s => document.getElementById(s)?.classList.remove('hidden'));
      } else if (tabName === 'tv') {
        document.getElementById('sectionTV')?.classList.remove('hidden');
        renderTVGrid();
      }
    }

    function renderTVGrid() {
      const grid = document.getElementById('gridTVChannels');
      grid.innerHTML = '';

      let list = CHANNELS_DATABASE;
      if (tvCategory !== 'all') {
        list = list.filter(c => c.category === tvCategory);
      }

      list.forEach(ch => {
        const div = document.createElement('div');
        div.className = "liquid-glass-card group relative overflow-hidden flex flex-col cursor-pointer border-rose-500/20 hover:border-rose-500/80 transition shadow-lg";
        div.onclick = () => playChannelDynamic(ch.id, ch.name);

        div.innerHTML = `
          <div class="aspect-video w-full bg-gradient-to-br ${ch.color} relative overflow-hidden rounded-t-2xl flex items-center justify-center p-3">
            <div class="absolute top-2 left-2 z-20">
              <span class="badge-capa text-[9px] font-extrabold px-2 py-0.5 rounded-lg text-rose-400 flex items-center gap-1">
                <span class="w-1.5 h-1.5 rounded-full bg-rose-500 animate-pulse"></span> AO VIVO
              </span>
            </div>

            <div class="text-center flex flex-col items-center gap-1 text-white">
              <i class="fa-solid ${ch.icon} text-3xl text-rose-400 drop-shadow-md"></i>
              <span class="text-xs font-black tracking-wider uppercase mt-1">${ch.name}</span>
            </div>
          </div>

          <div class="p-3 bg-black/40 rounded-b-2xl border-t border-white/10">
            <h4 class="font-bold text-xs text-white truncate">${ch.name}</h4>
          </div>
        `;
        grid.appendChild(div);
      });
    }

    // RESOLVE A URL EM TEMPO REAL PARA EVITAR O ERRO 404
    async function playChannelDynamic(channelId, channelName) {
      loadIframeUrl('', channelName, 'Buscando sinal...');

      let finalUrl = `https://reidosembeds.online/embed/${channelId}`;
      
      try {
        const targetApi = `https://reidosembeds.online/api/channel?id=${channelId}`;
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetApi)}`;
        const res = await fetch(proxyUrl);
        const data = await res.json();

        if (data && (data.embed_url || data.url || data.player)) {
          finalUrl = data.embed_url || data.url || data.player;
        } else {
          finalUrl = `https://v2.rdembed.sbs/canal/${channelId}`;
        }
      } catch (e) {
        finalUrl = `https://v2.rdembed.sbs/canal/${channelId}`;
      }

      loadIframeUrl(finalUrl, channelName, 'TV ao Vivo');
    }

    function playCustomUrl(url, title, subtitle) {
      loadIframeUrl(url, title, subtitle);
    }

    function loadIframeUrl(embedUrl, title, subtitle) {
      document.getElementById('playerTitle').innerText = title;
      document.getElementById('playerSubtitle').innerText = subtitle || 'Player Principal';

      const holder = document.getElementById('iframeHolder');
      holder.innerHTML = '';

      if (!embedUrl) {
        holder.innerHTML = `<div class="w-full h-full flex items-center justify-center text-zinc-400 text-sm font-semibold">Carregando player...</div>`;
      } else {
        const iframe = document.createElement('iframe');
        iframe.src = embedUrl;
        iframe.className = "w-full h-full border-0 relative z-10";
        iframe.allow = "autoplay; encrypted-media; fullscreen; picture-in-picture";
        iframe.setAttribute('allowfullscreen', 'true');
        holder.appendChild(iframe);
      }

      const overlay = document.getElementById('playerOverlay');
      overlay.classList.replace('opacity-0', 'opacity-100');
      overlay.classList.replace('pointer-events-none', 'pointer-events-auto');
    }

    function closePlayer() {
      document.getElementById('iframeHolder').innerHTML = '';
      const overlay = document.getElementById('playerOverlay');
      overlay.classList.replace('opacity-100', 'opacity-0');
      overlay.classList.replace('pointer-events-auto', 'pointer-events-none');
    }

    function filterTVCategory(cat, btn) {
      tvCategory = cat;
      document.querySelectorAll('#tvFilterButtons .genre-btn').forEach(b => b.classList.remove('genre-btn-active'));
      btn.classList.add('genre-btn-active');
      renderTVGrid();
    }

    async function loadFullHomeData() {
      try {
        const resTrend = await fetch(`https://api.themoviedb.org/3/trending/all/week?api_key=${TMDB_API_KEY}&language=pt-BR`);
        const dataTrend = await resTrend.json();
        if (dataTrend.results && dataTrend.results.length > 0) {
          const item = dataTrend.results[0];
          document.getElementById('heroBg').style.backgroundImage = `url('https://image.tmdb.org/t/p/original${item.backdrop_path}')`;
          document.getElementById('heroTitle').innerText = item.title || item.name;
          document.getElementById('heroOverview').innerText = item.overview || '';
          document.getElementById('heroPlayBtn').onclick = () => playCustomUrl(`https://superflixapi.quest/filme/${item.id}`, item.title || item.name, 'Filme');

          const grid = document.getElementById('gridTrending');
          grid.innerHTML = '';
          dataTrend.results.slice(1, 13).forEach(it => {
            const title = it.title || it.name;
            const poster = `https://image.tmdb.org/t/p/w500${it.poster_path}`;
            const div = document.createElement('div');
            div.className = "liquid-glass-card group relative overflow-hidden flex flex-col cursor-pointer";
            div.onclick = () => playCustomUrl(`https://superflixapi.quest/filme/${it.id}`, title, 'Filme');
            div.innerHTML = `
              <div class="aspect-[2/3] w-full bg-black/40 relative overflow-hidden rounded-t-2xl">
                <img src="${poster}" alt="${title}" loading="lazy" class="w-full h-full object-cover">
              </div>
              <div class="p-3 bg-black/30 rounded-b-2xl border-t border-white/10">
                <h4 class="font-bold text-xs text-white truncate">${title}</h4>
              </div>
            `;
            grid.appendChild(div);
          });
        }
      } catch (err) {}
    }

    function handleGlobalSearch(e) {
      const query = document.getElementById('globalSearchInput').value.trim().toLowerCase();
      const panel = document.getElementById('searchResultsPanel');
      const clearBtn = document.getElementById('clearSearchBtn');
      const listContainer = document.getElementById('resultsTVList');
      const section = document.getElementById('sectionTVResults');

      if (!query) { clearGlobalSearch(); return; }

      clearBtn.classList.remove('hidden');
      panel.classList.replace('opacity-0', 'opacity-100');
      panel.classList.replace('pointer-events-none', 'pointer-events-auto');

      const matches = CHANNELS_DATABASE.filter(c => c.name.toLowerCase().includes(query));
      listContainer.innerHTML = '';

      if (matches.length > 0) {
        section.classList.remove('hidden');
        matches.forEach(ch => {
          const div = document.createElement('div');
          div.className = "flex items-center justify-between p-3 rounded-2xl border border-rose-500/30 bg-[#25283b] w-full gap-2.5";
          div.innerHTML = `
            <div class="flex items-center gap-3 min-w-0 flex-1">
              <i class="fa-solid ${ch.icon} text-rose-400"></i>
              <span class="font-bold text-sm text-white">${ch.name}</span>
            </div>
            <button onclick="playChannelDynamic('${ch.id}', '${ch.name}')" class="px-4 py-2 rounded-xl bg-rose-600 text-white text-xs font-black">
              Assistir
            </button>
          `;
          listContainer.appendChild(div);
        });
      } else {
        section.classList.add('hidden');
      }
    }

    function clearGlobalSearch() {
      document.getElementById('globalSearchInput').value = '';
      const panel = document.getElementById('searchResultsPanel');
      document.getElementById('clearSearchBtn').classList.add('hidden');
      panel.classList.replace('opacity-100', 'opacity-0');
      panel.classList.replace('pointer-events-auto', 'pointer-events-none');
    }
  </script>
</body>
</html>
